[dataset]

tensor_type = float

task_type = seg

num_worker = 0

train_dir = ./data

train_csv = ./config/train.csv

valid_csv = ./config/valid.csv

test_csv = ./config/test.csv

train_batch_size = 1


train_transform = [Rescale, RandomCrop, RandomFlip, NormalizeWithMeanStd, LabelConvert, LabelToProbability]

valid_transform = [Rescale, NormalizeWithMeanStd, LabelConvert, LabelToProbability]

test_transform = [Rescale, NormalizeWithMeanStd]


Rescale_output_size = [256, 384]

randomcrop_output_size=[128,192]

RandomFlip_flip_depth = False
RandomFlip_flip_height = True
RandomFlip_flip_width = True


NormalizeWithMeanStd_channels = [0]

LabelConvert_source_list = [0, 255]

LabelConvert_target_list = [0, 1]


[network]

net_type = UNet

class_num = 2

in_chns = 1

feature_chns=[8,16,32,64,128]

dropout = [0.0, 0.0, 0.3, 0.4, 0.5]


[training]

gpus = [0]

loss_type = [DiceLoss, CrossEntropyLoss]
loss_weight = [1.0, 1.0]

optimizer = Adam
learning_rate = 1e-3
momentum = 0.9
weight_decay = 1e-5

lr_scheduler = PolynomialLR
lr_power = 0.8

ckpt_dir = ./model/unet2d

iter_max = 10000
iter_valid = 500
iter_save = 1000
[testing]

gpus = [0]

ckpt_mode = 0

output_dir = ./result/unet2d

sliding_window_enable = True

sliding_window_size = [224, 320]

sliding_window_stride = [224, 320]

label_source = [0, 1]

label_target = [0, 255]
